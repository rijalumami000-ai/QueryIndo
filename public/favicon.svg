<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- Brand Cyan-Violet Gradient -->
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#qGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Glowing Ambient Halo -->
  <circle cx="64" cy="62" r="38" fill="url(#qGrad)" opacity="0.12" filter="url(#subtleGlow)"/>

  <!-- Futuristic Hexagonal 'Q' Outer Ring -->
  <path d="M 64 24 
           L 96 42.5 
           L 96 79.5 
           L 64 98 
           L 32 79.5 
           L 32 42.5 Z" 
        fill="none" 
        stroke="url(#qGrad)" 
        stroke-width="5.5" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Concentric Query Core -->
  <circle cx="64" cy="61" r="18" fill="none" stroke="#00F2FE" stroke-width="4" stroke-dasharray="85 15" filter="url(#neonGlow)"/>
  <circle cx="64" cy="61" r="7" fill="url(#qGrad)"/>

  <!-- Diagonal Cyber Query Tail -->
  <path d="M 74 71 L 102 99 L 88 99 L 78 89 Z" fill="url(#glowGrad)" filter="url(#neonGlow)"/>
  <line x1="68" y1="65" x2="100" y2="97" stroke="#00F2FE" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Neural Circuit Data Nodes -->
  <circle cx="32" cy="42.5" r="3" fill="#00F2FE"/>
  <circle cx="96" cy="42.5" r="3" fill="#8B5CF6"/>
  <circle cx="32" cy="79.5" r="3" fill="#3B82F6"/>
  <circle cx="102" cy="99" r="3.5" fill="#00F2FE" filter="url(#neonGlow)"/>

  <!-- Small horizontal circuit bus -->
  <line x1="20" y1="61" x2="32" y2="61" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="20" cy="61" r="2" fill="#00F2FE"/>
</svg>